name: astrbot_plugin_livingemotion
display_name: livingEmotion
short_desc: 为原生人格加入持续心情与作息，规则情绪无需模型，承诺到期执行。
desc: >-
  规则情绪无需模型调用，原生人格的心情、关系、作息与精力持续保存。
  主动聊天、日记梦境与记忆按需开启，延后约定到期执行，未知结果不盲目重试。
  控制台自动刷新并保留编辑草稿，模型与独立开关集中设置，普通使用无需 Node 或外部 CDN。
  接入 QQ、Telegram、Discord；随机主动使用 QQ 号码名单，OneBot 提供消息编号回执，WebChat 暂不支持。
help: >-
  第一次使用：打开插件页面 livingemotion → 设置 → 快速开始，选择人格并保存。
  情绪强度先选平常，规则情绪不用模型；主动聊天、日记和梦境按需开启。
  安装、保存生效见 docs/user-guide.md，常见问题见 docs/troubleshooting.md；le_wake 仅管理员手动叫醒。
  开发者：GitHub AKIhunter；配置、流程图和迁移入口见 README。
version: 0.7.0
author: AKIhunter
# Public repository; commits and CI are recorded in GitHub.
repo: https://github.com/AKIhunter/astrbot_plugin_livingemotion
# Candidate gate; final four-host evidence is recorded in docs/compatibility.md.
astrbot_version: ">=4.29.1,<=4.29.4"
# 声明基础消息接入；主动投递与回执能力的差异见 docs/compatibility.md。
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - discord
social_link: https://github.com/AKIhunter
tags:
  - 情绪
  - 原生人格
  - 作息
  - 关系
  - 记忆
  - WebUI
views:
  - name: livingemotion
    description: TA、情绪、关系、长夜、日记梦境与集中设置
