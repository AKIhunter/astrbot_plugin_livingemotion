name: astrbot_plugin_livingemotion
display_name: livingEmotion
short_desc: 原生人格的生活控制台，情绪雷达、关系图、长夜与可选记忆。
desc: >-
  柔和复古未来主义九区页面，支持全局、私聊与群聊范围及圆形扩散双主题。
  提供四维情绪计算、五轴展示、平台账号关系图、五档作息、天气日记与梦境。
  LivingMemory 或本地原生向量接入，模型与模块集中设置，读写和主动行为分别启用。
help: >-
  第一次使用：打开插件页面 livingemotion → 设置 → 快速开始，选择人格并保存。
  情绪强度先选平常，规则情绪不用模型；主动聊天、日记和梦境按需开启。
  安装、保存生效和常见问题见 docs/plugin-manual.md；le_wake 仅管理员手动叫醒。
  开发者：GitHub AKIhunter；配置、流程图和迁移入口见 README。
