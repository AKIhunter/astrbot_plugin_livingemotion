<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="livingEmotion · TA 的生活控制台">livingEmotion · TA 的生活控制台</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="跳到主要内容">跳到主要内容</a>
  <header class="masthead">
    <div class="identity">
      <div class="wordmark" aria-label="livingEmotion">living<span>Emotion</span><i aria-hidden="true"></i></div>
      <p class="eyebrow"><span data-i18n="TA 的生活控制台">TA 的生活控制台</span> <span aria-hidden="true">/</span> PERSONAL TELEMETRY</p>
    </div>
    <div class="header-controls">
      <button id="refresh" type="button" title="更新状态和列表，不会生成或删除内容" data-i18n="刷新" data-i18n-title="更新状态和列表，不会生成或删除内容">刷新</button>
      <span id="connection" class="sr-only" role="status" data-i18n="正在连接宿主">正在连接宿主</span>
      <div class="theme-control">
      <label for="language" data-i18n="界面语言">界面语言</label>
      <select id="language" aria-label="界面语言" data-i18n-aria-label="界面语言"><option value="zh-CN" data-i18n="中文">中文</option><option value="en">English</option><option value="ja" data-i18n="日本語">日本語</option></select>
      <div class="theme-switch" role="group" aria-label="页面主题" data-i18n-aria-label="页面主题">
        <button type="button" data-theme-choice="light" aria-pressed="false" data-i18n="白昼">白昼</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" data-i18n="黑夜">黑夜</button>
      </div>
      <span id="theme-status" class="micro" aria-live="polite"></span>
      </div>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
    <nav id="navigation" aria-label="管理分区" data-i18n-aria-label="管理分区">
      <button type="button" data-section="overview" aria-current="page"><span>01</span>TA</button>
      <button type="button" data-section="persona"><span>02</span>人格</button>
      <button type="button" data-section="relationships"><span>03</span>关系</button>
      <button type="button" data-section="behavior"><span>04</span>主动行为</button>
      <button type="button" data-section="night"><span>05</span>长夜</button>
      <button type="button" data-section="experience"><span>06</span>日记与梦境</button>
      <button type="button" data-section="memory"><span>07</span>记忆接入</button>
      <button type="button" data-section="settings"><span>08</span>设置</button>
    </nav>
      <section id="environment" class="environment-card" aria-label="当地天气与时间" hidden>
        <span id="environment-city" class="eyebrow"></span>
        <time id="environment-clock" class="environment-clock"></time>
        <span id="environment-date" class="micro"></span>
        <p id="environment-weather" class="environment-weather"></p>
        <span id="environment-zone" class="micro"></span>
      </section>
    </aside>
    <main id="main" tabindex="-1">
      <div class="section-heading">
        <div><p id="section-kicker" class="eyebrow">01 / TA</p><h1 id="section-title">TA</h1></div>
        <span id="mode" class="status" data-i18n="等待状态">等待状态</span>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <div id="content" aria-busy="true"><p class="empty" data-i18n="正在读取已授权的状态…">正在读取已授权的状态…</p></div>
      <section id="settings" hidden></section>
      <section id="records" hidden aria-label="历史记录" data-i18n-aria-label="历史记录"></section>
      <footer class="page-footer"><span data-i18n="livingEmotion / 私人生活档案">livingEmotion / 私人生活档案</span><span data-i18n="主观状态不等于真实事实">主观状态不等于真实事实</span></footer>
    </main>
  </div>
  <section id="editor" class="editor" hidden aria-label="保存更改" data-i18n-aria-label="保存更改">
    <div class="editor-summary">
      <span id="draft-count" aria-live="polite"></span>
      <span id="draft-feedback" class="micro" role="status" hidden></span>
    </div>
    <div class="editor-actions">
      <button id="discard" type="button" data-i18n="放弃更改">放弃更改</button>
      <button id="rebase" type="button" hidden data-i18n="保留我的修改">保留我的修改</button>
      <button id="save" class="primary" type="button" data-i18n="保存">保存</button>
    </div>
    <details id="draft-review" hidden>
      <summary data-i18n="查看冲突项">查看冲突项</summary>
      <div id="draft-conflicts"></div>
    </details>
  </section>
  <noscript data-i18n="管理页面需要 JavaScript 才能通过宿主读取数据；不会显示缓存或演示状态。">管理页面需要 JavaScript 才能通过宿主读取数据；不会显示缓存或演示状态。</noscript>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
</body>
</html>
